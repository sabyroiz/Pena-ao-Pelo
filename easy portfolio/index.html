<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pena ao Pelo</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>
    <img class="decoracao arvore" src="arvore.png" alt="Árvore">
    <img class="decoracao feno" src="feno.png" alt="Feno">
    <img class="decoracao pedra" src="pedra.png" alt="Pedra">
    <img class="decoracao arvore2" src="arvore.png" alt="Árvore">
    <img class="decoracao arvore3" src="arvore.png" alt="Árvore">
    <img class="decoracao flor" src="flor.png" alt="Flor">
    <img class="decoracao poco" src="poco.png" alt="Poço">
    <img class="decoracao galinheiro" src="galinheiro.png" alt="Galinheiro">
    
     <main class="fazenda">

        <section class="cercado">

            <h1>🐔 Pena ao Pelo</h1>

            <p>🥚 Ovos: <span id="ovos">0</span></p>

            <p>🐭 Por clique: <span id="porClique">1</span></p>

            <p>⏳ Automático: <span id="tempo">0</span>s</p>

            <button id="galinha">
                <img src="galinha.png" alt="Galinha">
            </button>

        </section>

    </main>

   <div id="gatoArea">

    <img id="gato" src="gato.png" alt="Gatinho">

    <div id="casinhaGato">
        <img src="casa.png" alt="Casinha do Gato">
    </div>

    <p>
        🐭 Ratinhos pegos:
        <span id="ratosPegos">0</span>
    </p>

</div>

<div id="rato">
    <img src="rato.png" alt="Ratinho">
</div>

    <aside class="Loja">

        <h2>🛍️ Loja</h2>

        <button id="upgradeClique">
            🥚 Mais ovos por clique
            <br>
            <span id="precoClique">10</span> ovos
        </button>

        <button id="upgradeAutomatico">
            ⚡ Produção automática
            <br>
            <span id="precoAutomatico">25</span> ovos
        </button>

        <button id="comprarGato">
            🐱 Comprar gatinho
            <br>
            <span id="precoGato">100</span> ovos
        </button>

    </aside>


    <script src="script.js"></script>

</body>

</html>
